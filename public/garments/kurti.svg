<svg xmlns="http://www.w3.org/2000/svg" width="520" height="860" viewBox="0 0 520 860">
  <defs>
    <!-- Royal Plum Silk / Jacquard Gradient -->
    <linearGradient id="kurtiBodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="30%" stop-color="#7e22ce"/>
      <stop offset="70%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <!-- Torso Volume Highlight -->
    <radialGradient id="kurtiHighlight" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#7e22ce" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Zari Embroidery Gradient -->
    <linearGradient id="goldZari" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="innerNeckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <filter id="kurtiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3b0764" flood-opacity="0.45"/>
    </filter>

    <filter id="placketShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3b0764" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Kurti Body Silhouette with A-Line Flow & Side Slits -->
  <path fill="url(#kurtiBodyGrad)" filter="url(#kurtiShadow)" d="
    M 205 38
    C 175 42, 135 56, 96 78
    L 52 136
    C 42 148, 44 165, 56 176
    L 104 224
    C 114 234, 128 234, 138 224
    L 152 196
    C 142 280, 134 440, 134 580
    C 134 660, 126 760, 138 826
    C 180 832, 220 834, 260 834
    C 300 834, 340 832, 382 826
    C 394 760, 386 660, 386 580
    C 386 440, 378 280, 368 196
    L 382 224
    C 392 234, 406 234, 416 224
    L 464 176
    C 476 165, 478 148, 468 136
    L 424 78
    C 385 56, 345 42, 315 38
    C 290 42, 280 64, 260 64
    C 240 64, 230 42, 205 38 Z
  "/>

  <!-- 3D Chest & Torso Sheen -->
  <path fill="url(#kurtiHighlight)" d="
    M 152 196
    C 152 196, 200 160, 260 160
    C 320 160, 368 196, 368 196
    C 370 380, 374 620, 374 810
    C 330 822, 290 826, 260 826
    C 230 826, 190 822, 146 810
    C 146 620, 150 380, 152 196 Z
  "/>

  <!-- Left Sleeve Seam -->
  <path stroke="url(#goldZari)" stroke-width="1.6" fill="none" d="M 96 78 C 115 115, 134 156, 152 196"/>
  <path stroke="url(#goldZari)" stroke-width="1.4" stroke-dasharray="3,2" fill="none" d="M 64 148 L 112 212"/>

  <!-- Right Sleeve Seam -->
  <path stroke="url(#goldZari)" stroke-width="1.6" fill="none" d="M 424 78 C 405 115, 386 156, 368 196"/>
  <path stroke="url(#goldZari)" stroke-width="1.4" stroke-dasharray="3,2" fill="none" d="M 456 148 L 408 212"/>

  <!-- Side Slits Indication -->
  <line x1="134" y1="580" x2="138" y2="826" stroke="#3b0764" stroke-width="2.5"/>
  <line x1="386" y1="580" x2="382" y2="826" stroke="#3b0764" stroke-width="2.5"/>

  <!-- Inner Neckline Opening -->
  <path fill="url(#innerNeckGrad)" d="
    M 210 38
    C 230 48, 290 48, 310 38
    C 300 68, 220 68, 210 38 Z
  "/>

  <!-- Ornate Mandarin Collar & Gold Embroidered Placket -->
  <g id="placket" filter="url(#placketShadow)">
    <!-- Collar Band -->
    <path fill="url(#goldZari)" stroke="rgba(255,255,255,0.4)" stroke-width="1" d="
      M 205 38
      C 225 54, 295 54, 315 38
      C 305 60, 290 74, 260 74
      C 230 74, 215 60, 205 38 Z
    "/>

    <!-- Central Embroidered Panel -->
    <rect x="250" y="74" width="20" height="380" fill="url(#goldZari)" rx="3"/>
    <rect x="253" y="77" width="14" height="374" fill="#6b21a8" rx="2"/>

    <!-- Gold Zari Motifs down the placket -->
    <g fill="url(#goldZari)">
      <circle cx="260" cy="110" r="3.5"/>
      <circle cx="260" cy="160" r="3.5"/>
      <circle cx="260" cy="210" r="3.5"/>
      <circle cx="260" cy="260" r="3.5"/>
      <circle cx="260" cy="310" r="3.5"/>
      <circle cx="260" cy="360" r="3.5"/>
      <circle cx="260" cy="410" r="3.5"/>
    </g>
  </g>

  <!-- Hemline Gold Border -->
  <path stroke="url(#goldZari)" stroke-width="4" fill="none" d="M 138 820 C 180 826, 340 826, 382 820"/>
  <path stroke="url(#goldZari)" stroke-width="1.5" stroke-dasharray="4,2" fill="none" d="M 140 812 C 180 818, 340 818, 380 812"/>
</svg>