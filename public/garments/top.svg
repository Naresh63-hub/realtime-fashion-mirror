<svg xmlns="http://www.w3.org/2000/svg" width="560" height="600" viewBox="0 0 560 600">
  <defs>
    <!-- Rose Satin Silk Gradient -->
    <linearGradient id="topBodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="75%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <radialGradient id="topHighlight" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="innerNeckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <filter id="topShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#881337" flood-opacity="0.35"/>
    </filter>

    <filter id="strapShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#881337" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Top Body Silhouette -->
  <path fill="url(#topBodyGrad)" filter="url(#topShadow)" d="
    M 215 42
    C 196 90, 160 120, 120 148
    C 114 152, 116 166, 122 174
    L 138 210
    C 142 270, 140 380, 138 560
    C 180 570, 230 574, 280 574
    C 330 574, 380 570, 422 560
    C 420 380, 418 270, 422 210
    L 438 174
    C 444 166, 446 152, 440 148
    C 400 120, 364 90, 345 42
    C 315 70, 245 70, 215 42 Z
  "/>

  <!-- 3D Chest Drape Highlight -->
  <path fill="url(#topHighlight)" d="
    M 140 210
    C 140 210, 200 160, 280 160
    C 360 160, 420 210, 420 210
    C 418 360, 416 480, 416 550
    C 370 562, 320 566, 280 566
    C 240 566, 190 562, 144 550
    C 144 480, 142 360, 140 210 Z
  "/>

  <!-- Inner Neckline Cutout -->
  <path fill="url(#innerNeckGrad)" d="
    M 218 42
    C 240 60, 320 60, 342 42
    C 330 68, 230 68, 218 42 Z
  "/>

  <!-- Elegant Sweetheart Neckline Trim -->
  <path fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" filter="url(#strapShadow)" d="
    M 215 42
    C 245 78, 260 84, 280 84
    C 300 84, 315 78, 345 42
  "/>

  <!-- Delicate Fabric Dart Stitches -->
  <path stroke="rgba(255,255,255,0.22)" stroke-width="1.2" stroke-dasharray="3,2" fill="none" d="M 210 240 C 225 280, 235 340, 235 410"/>
  <path stroke="rgba(255,255,255,0.22)" stroke-width="1.2" stroke-dasharray="3,2" fill="none" d="M 350 240 C 335 280, 325 340, 325 410"/>

  <!-- Hemline Stitch -->
  <path stroke="rgba(255,255,255,0.25)" stroke-width="1.2" stroke-dasharray="4,2" fill="none" d="M 142 552 C 180 560, 380 560, 418 552"/>
</svg>